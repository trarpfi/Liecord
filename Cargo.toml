[workspace]
members = ["backend", "shared"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["LieCord Team"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
